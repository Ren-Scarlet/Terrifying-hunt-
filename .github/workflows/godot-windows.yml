name: Godot Windows 单机版

on:
  push:
    branches: [godot-single-player-port]
    paths:
      - "godot/**"
      - ".github/workflows/godot-windows.yml"
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate project import
        shell: pwsh
        run: |
          $godotExe = Join-Path $env:USERPROFILE "godot/Godot_v4.7.2-stable_win64.exe"
          & $godotExe --headless --editor --path godot --quit

      - name: Export Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path godot/build | Out-Null
          $godotExe = Join-Path $env:USERPROFILE "godot/Godot_v4.7.2-stable_win64.exe"
          Write-Host "Godot executable:" $godotExe
          & $godotExe --version
          $output = Join-Path $PWD "godot/build/暗夜杀机.exe"
          Write-Host "Export target:" $output
          & $godotExe --headless --verbose --path godot --export-release "Windows Desktop" $output
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object -ExpandProperty FullName
          if (!(Test-Path $output)) { throw "Godot export did not create expected executable: $output" }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: 暗夜杀机-Godot-Windows
          path: |
            godot/build/暗夜杀机.exe
          if-no-files-found: error
          retention-days: 14

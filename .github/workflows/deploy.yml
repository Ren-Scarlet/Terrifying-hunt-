# 单一构建：正式站与 /preview/ 使用同一份产物。
# 之前 /preview/ 单独从 feature/in-game-map-hud 构建，导致每次改动要推两次、两条分支还会漂移。
# 现在只维护 main：推一次 main，正式站和 /preview/ 同时更新。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Typecheck, rules and smoke
        run: |
          npm ci --prefix source
          npm run check --prefix source
          npm run build --prefix source
      - name: Publish to root and /preview/
        run: |
          mkdir -p dist/preview
          cp -a source/dist/. dist/
          cp -a source/dist/. dist/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
